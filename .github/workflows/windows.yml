# Builds, tests and packages PlayDrop on GitHub's Windows runner, since there is no Windows
# machine. What this proves: the workspace compiles and links with the MSVC toolchain, the
# unit and loopback tests pass on Windows, clippy is clean for the Windows code paths, and
# the Inno Setup installer compiles, installs silently, puts `playdrop` on PATH and uninstalls
# cleanly, and the installed programs really start (packaging/windows/test-installer.ps1: no
# C runtime DLL imports, GUI subsystem for the daemon and the window, the daemon stays up
# and answers `playdrop status`, the window stays open and connects, a daemon that cannot
# start exits with a FATAL log line and no dialog, /RELAUNCH=1 restarts both and the window
# connects, /RELAUNCH=daemon restarts the daemon alone). What it cannot
# prove: anything that needs someone at the screen (the tray, SendInput, GSMTC media, the
# firewall prompt, the installer's wizard on a real Windows 11 machine; see
# packaging/windows/README.md).
#
# playdrop-ffi is excluded everywhere below: it only targets Android and iOS, and it uses
# std::os::fd to adopt file descriptors from the Android host, which does not exist on
# Windows. uniffi-bindgen is a plain CLI and builds on Windows, so it stays in.
#
# Tests: none are skipped. The ones that need a LAN interface with multicast or a live
# daemon are already #[ignore] in the code and do not run here. If a test fails on the
# runner only because the runner has no interactive desktop, add `--skip <exact name>` to
# the test step with a comment saying why; do not skip whole crates.
#
# Also called by release.yml (workflow_call) to build the installer for a release.
#
# The run-checks input is compared as a string below: on push and workflow_dispatch the
# input is null, and `null != false` is false in a GitHub expression (both coerce to 0),
# which skipped the build, test and clippy steps on every push until 2026-10-14.

name: Windows

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "packaging/windows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "packaging/windows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      run-checks:
        description: "Run the debug build, tests and clippy before packaging"
        type: boolean
        default: true

# Inside workflow_call, github.workflow is the caller's name, so a release run never shares
# a group with (or cancels) a push run on the same ref.
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # Incremental builds only waste cache space on CI.
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    name: Build, test and package (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain versions
        # rust-toolchain.toml pins the stable channel with clippy and rustfmt; rustup installs
        # it on first use. The default host on this runner is x86_64-pc-windows-msvc.
        run: |
          rustup show
          rustc --version --verbose
          cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc

      - name: Build (debug)
        if: ${{ format('{0}', inputs.run-checks) != 'false' }}
        run: cargo build --workspace --exclude playdrop-ffi --locked

      - name: Test
        if: ${{ format('{0}', inputs.run-checks) != 'false' }}
        # A hung test must not eat the job's 90 minutes: the first real run on 2026-10-14
        # had gate_b and gate_d still running after an hour. Known Windows failures are
        # listed in docs/phases/phase-6-ship-gate.md section 6.
        timeout-minutes: 25
        run: cargo test --workspace --exclude playdrop-ffi --locked --no-fail-fast

      - name: Clippy
        if: ${{ format('{0}', inputs.run-checks) != 'false' }}
        run: cargo clippy --workspace --exclude playdrop-ffi --all-targets --locked -- -D warnings

      - name: Make sure Inno Setup is installed
        # The windows-2025 image ships Inno Setup 6 (ISCC.exe under Program Files (x86)).
        # Install it through Chocolatey only if a future image drops it.
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (Test-Path $iscc) {
            Write-Host "Found $iscc"
          } else {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed ($LASTEXITCODE)" }
          }

      - name: Release build and installer
        # build-windows.ps1 runs `cargo build --release --locked --target x86_64-pc-windows-msvc
        # -p playdropd -p playdrop-desktop -p playdrop-cli`, reads the version from
        # [workspace.package] and compiles packaging/windows/playdrop.iss with ISCC.
        run: packaging/windows/build-windows.ps1

      - name: Install, check and uninstall on the runner
        # A silent install as admin: the three programs land in Program Files, `playdrop` is
        # on the system PATH and runs, the firewall rules name playdropd.exe, the installed
        # daemon and window start and stay up (their logs are printed into this step's
        # output), and uninstall takes all of it back out. A release run fails here too,
        # before anything is published. The script sets PLAYDROP_NO_FATAL_DIALOG, so an error
        # box can never hold the step; the timeout is for anything else that hangs.
        timeout-minutes: 25
        run: packaging/windows/test-installer.ps1

      - name: Name the installer for the release
        id: name
        run: |
          $toml = Get-Content Cargo.toml -Raw
          $section = [regex]::Match($toml, '(?ms)^\[workspace\.package\](.*?)(^\[|\z)').Groups[1].Value
          $version = [regex]::Match($section, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'Could not read the workspace version' }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "packaging/windows/dist/PlayDrop-$version-x64-setup.exe" "out/playdrop-$version-windows-x64-setup.exe"
          Get-ChildItem out

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: out/*.exe
          if-no-files-found: error
