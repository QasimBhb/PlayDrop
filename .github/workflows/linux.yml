# Builds and tests PlayDrop on GitHub's Ubuntu runner, so the Linux code paths get the same
# check the Windows ones do. What this proves: the whole workspace (core, CLI, IPC, daemon,
# Slint window, FFI, uniffi-bindgen) is formatted, compiles with no clippy warnings, and the
# unit and loopback tests pass on Linux. What it cannot prove: anything that needs someone at
# a desktop (the COSMIC or GNOME tray and notifications, the RemoteDesktop portal consent
# dialog, Wayland clipboard, MPRIS players, autostart, the Flatpak and .deb packages; see
# docs/release/test-matrix.md).
#
# Nothing is excluded. The tests that need a LAN interface with multicast or a running
# daemon are already #[ignore] in the code and stay ignored, as do the clipboard, portal and
# MPRIS tests that need a desktop session. If a test fails on the runner only because it has
# no desktop, add `--skip <exact name>` to the test step with a comment saying why; do not
# skip whole crates.
#
# D-Bus: the playdrop-ipc round trip starts its own private dbus-daemon, and some playdropd
# code opens the session bus. The runner has no session bus, so the test command runs inside
# `dbus-run-session --` (package `dbus`), which starts a throwaway one for the run.
#
# Clippy runs with -D warnings. The runner installs the current stable Rust (the channel in
# rust-toolchain.toml), which can be a release behind or ahead of the development machine
# (1.98 against 1.99 was seen in Phase 6), so a new or removed lint can fail here while it
# passes locally. Fix the code, or pin the channel in rust-toolchain.toml; do not drop the flag.
#
# Runs on pushes to main and pull requests that touch the Rust code, and on demand.

name: Linux

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "apps/cosmic-applet/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packaging/flatpak/cargo-sources.json"
      - "packaging/flatpak/check-sources.py"
      - ".github/workflows/linux.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "apps/cosmic-applet/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packaging/flatpak/cargo-sources.json"
      - "packaging/flatpak/check-sources.py"
      - ".github/workflows/linux.yml"
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental builds only waste cache space on CI.
  CARGO_INCREMENTAL: "0"
  # Full debug info for every test binary filled the runner's disk on 2026-11-03. Line tables
  # still give file and line in a panic.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  linux:
    name: Format, lint, build and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain versions
        # rust-toolchain.toml pins the stable channel with clippy and rustfmt; rustup installs
        # it on first use.
        run: |
          rustup show
          rustc --version --verbose
          cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - name: Install system packages
        # Slint window: fontconfig, xkbcommon, GL headers (same list as release.yml, plus
        # libwayland-dev for winit). dbus provides dbus-daemon and dbus-run-session. zbus is
        # pure Rust, so libdbus-1-dev is not needed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev dbus

      - name: Flatpak crate list is in step with Cargo.lock
        # The Flatpak release job builds offline from packaging/flatpak/cargo-sources.json.
        # A crate added to Cargo.lock without regenerating that file fails only at release
        # time (v0.3.0, 2026-10-17), so it is checked here on every push.
        run: python3 -I packaging/flatpak/check-sources.py

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build (debug)
        run: cargo build --workspace --locked

      - name: Test
        # A hung test must not eat the job's 60 minutes (the Windows run had two gates hang
        # for an hour on 2026-10-14), so the step has its own limit.
        timeout-minutes: 25
        run: dbus-run-session -- cargo test --workspace --locked --no-fail-fast

  reach:
    # The iroh feature is off in every release artifact, so nothing else here compiles it and it
    # could break unnoticed. Its tests use a relay inside the test process, on loopback; no
    # public relay is contacted. bench/reach-netns.sh (gate R5) is run by hand.
    name: Cross-network reach behind the iroh feature (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-reach

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config dbus

      - name: Default builds do not contain iroh
        # Gate R3. Saved to a file first so a cargo failure fails the step, not the search.
        run: |
          for crate in playdropd playdrop-cli; do
            cargo tree -p "$crate" -e normal --locked --prefix none > tree.txt
            if grep -q '^iroh' tree.txt; then
              echo "$crate has iroh in a default build"
              exit 1
            fi
          done

      - name: Clippy with the feature
        run: |
          cargo clippy -p playdrop-core -p playdropd -p playdrop-cli --all-targets --locked \
            --features playdrop-core/iroh-test,playdropd/iroh,playdrop-cli/iroh -- -D warnings

      - name: Reach tests
        timeout-minutes: 15
        run: |
          cargo test -p playdrop-core --locked --features iroh-test --test phase12_reach
          cargo test -p playdrop-core --locked --features iroh-test --test sr32_canary

  cosmic-applet:
    # The COSMIC panel applet (shipped inside the .deb, used only when added to a panel) is
    # its own cargo workspace (apps/cosmic-applet) with a pinned libcosmic from git, so the
    # job above never compiles it. It depends on
    # playdrop-ipc and playdrop-core by path: a change there can break it, which is why this
    # runs on the same pushes.
    name: COSMIC panel applet (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/cosmic-applet
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/cosmic-applet -> target"
          key: linux-cosmic-applet

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev desktop-file-utils

      - name: Validate the desktop file
        run: desktop-file-validate data/org.playdrop.PlayDrop.CosmicApplet.desktop

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
