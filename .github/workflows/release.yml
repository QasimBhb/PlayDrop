# Builds every release asset and publishes them on GitHub Releases. GitHub Releases is the
# only distribution channel: no Play Store, no App Store (docs/release/distribution.md).
#
# How to release: bump `version` under [workspace.package] in the root Cargo.toml, commit,
# then tag that commit `v<version>` and push the tag. The version job refuses a tag that
# does not match Cargo.toml.
#
# Run it by hand (workflow_dispatch) for a dry run: every job builds and uploads its file
# as a workflow artifact, but no release is created.
#
# Assets (names stay the same from release to release, apart from the version):
#   playdrop-<ver>-android.apk                 signed with the PlayDrop release key
#   playdrop-<ver>-linux-amd64.deb             Pop!_OS and Ubuntu 24.04
#   playdrop-<ver>-linux-x86_64.flatpak        single-file Flatpak bundle
#   playdrop-<ver>-windows-x64-setup.exe       Inno Setup installer, not code signed
#   playdrop-<ver>-ios-unsigned.ipa            for SideStore or AltStore, which re-sign it
#   SHA256SUMS                                 sha256sum of every file above
#
# The APK name contains "android" and ends in .apk, and it is the only APK in the release,
# so Obtainium picks it without an asset filter.
#
# Secrets used (repository settings, Actions secrets):
#   PLAYDROP_KEYSTORE_BASE64   the release keystore (.jks), base64 encoded
#   PLAYDROP_KEYSTORE_PASSWORD, PLAYDROP_KEY_ALIAS, PLAYDROP_KEY_PASSWORD
# The android job fails when any of them is missing rather than ship a debug-signed APK.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    name: Read the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      prerelease: ${{ steps.read.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Read [workspace.package] version and check the tag
        id: read
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "::error::could not read the workspace version from Cargo.toml"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Version $version (prerelease: $prerelease)"

  linux-deb:
    name: Debian package
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        # Slint window: fontconfig, xkbcommon, GL and Wayland headers. The validators check
        # the desktop and AppStream files that go into the package.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev \
            desktop-file-utils appstream

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-linux

      - name: Validate the desktop and AppStream files
        run: |
          desktop-file-validate packaging/linux/org.playdrop.PlayDrop.desktop
          desktop-file-validate packaging/linux/org.playdrop.Daemon.desktop
          appstreamcli validate --no-net packaging/linux/org.playdrop.PlayDrop.metainfo.xml

      - name: Build the .deb
        # Called through bash: the script is stored without the executable bit in git.
        run: bash packaging/deb/build-deb.sh

      - name: Inspect and rename
        run: |
          ver="${{ needs.version.outputs.version }}"
          deb="packaging/deb/dist/playdrop_${ver}_amd64.deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          mkdir -p out
          cp "$deb" "out/playdrop-${ver}-linux-amd64.deb"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: out/*.deb
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Runs flatpak-builder on the runner itself, not in Flathub's container image. The first
    # dry run used the container and died with "No space left on device" inside cargo: the
    # runner's root disk starts with about 20 GB free, and the SDK, the rust extension, the
    # vendored crates and a release build of the whole workspace need more than that. On
    # the host we can first drop the preinstalled toolchains this job never uses (about
    # 25 GB), which a container job cannot do.
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          # apt removal of the big packages takes minutes and is not needed.
          large-packages: false
          swap-storage: false

      - name: Install flatpak-builder and the runtime
        # Same one-time setup as packaging/flatpak/README.md, with the distro flatpak-builder.
        # The runtime version must match runtime-version in the manifest.
        run: |
          sudo apt-get update
          # elfutils gives eu-strip, which flatpak-builder runs on the built binaries to
          # split out the debug info; the distro package does not pull it in.
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          # Ubuntu 24.04 restricts unprivileged user namespaces; bubblewrap ships an
          # AppArmor profile for this, the sysctl is a fallback for images without it.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08
          df -h / | tail -1

      - name: Build the bundle
        # Builds offline from packaging/flatpak/cargo-sources.json and exports a single-file
        # bundle. State and build dirs live in the runner's temp dir, outside the checkout.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/flatpak"
          cd packaging/flatpak
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --state-dir="$B/state" --repo="$B/repo" "$B/build-dir" org.playdrop.PlayDrop.yml
          mkdir -p "$GITHUB_WORKSPACE/out"
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "$B/repo" "$GITHUB_WORKSPACE/out/playdrop-$VERSION-linux-x86_64.flatpak" \
            org.playdrop.PlayDrop
          ls -la "$GITHUB_WORKSPACE/out"
          df -h / | tail -1

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: out/*.flatpak
          if-no-files-found: error

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7

      - name: Check the signing secrets
        # A release APK must carry the release key, or users cannot update over it.
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAYDROP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAYDROP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAYDROP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAYDROP_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing PLAYDROP_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing PLAYDROP_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing PLAYDROP_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing PLAYDROP_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::missing Actions secrets:$missing (see docs/release/distribution.md)"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install the Android SDK platform and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 ndk;27.1.12297006"

      - name: Install Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked --version "^4.1"
          cargo ndk --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-android

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAYDROP_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/playdrop-release.jks"
          echo "PLAYDROP_KEYSTORE_FILE=$RUNNER_TEMP/playdrop-release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        # build.gradle.kts reads the PLAYDROP_* variables when keystore.properties is absent
        # (it is gitignored, so it never is here). cargo-ndk uses the pinned NDK.
        env:
          PLAYDROP_KEYSTORE_PASSWORD: ${{ secrets.PLAYDROP_KEYSTORE_PASSWORD }}
          PLAYDROP_KEY_ALIAS: ${{ secrets.PLAYDROP_KEY_ALIAS }}
          PLAYDROP_KEY_PASSWORD: ${{ secrets.PLAYDROP_KEY_PASSWORD }}
        run: |
          test ! -e keystore.properties
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          test -d "$ANDROID_NDK_HOME"
          # gradlew is stored without the executable bit in git, so call it through bash.
          bash ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Check the signature and rename
        run: |
          ver="${{ needs.version.outputs.version }}"
          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::the APK is signed with the debug key"; exit 1
          fi
          mkdir -p out
          cp "$apk" "out/playdrop-${ver}-android.apk"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/playdrop-release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: apps/android/out/*.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: version
    # Same job as the Windows CI workflow: tests, clippy, then the Inno Setup installer,
    # uploaded as the artifact "windows-installer".
    uses: ./.github/workflows/windows.yml

  ios:
    name: Unsigned iOS app
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          sw_vers

      - name: Install Rust targets
        run: rustup target add aarch64-apple-ios

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-ios

      - name: Install XcodeGen
        run: brew install xcodegen && xcodegen --version

      - name: Build the Rust core and the XCFramework (device slice)
        run: ./scripts/build-core.sh --device-only

      - name: Write an unsigned Local.xcconfig
        # No team and no signing: SideStore and AltStore sign the app with the user's own
        # Apple ID when they install it.
        run: |
          cat > Local.xcconfig <<'XC'
          DEVELOPMENT_TEAM =
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY =
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGNING_ALLOWED = NO
          PROVISIONING_PROFILE_SPECIFIER =
          XC

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Archive
        # MARKETING_VERSION on the command line overrides the value in project.yml, so the
        # app reports the same version as Cargo.toml.
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project PlayDrop.xcodeproj \
            -scheme PlayDrop \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/PlayDrop.xcarchive \
            MARKETING_VERSION="${{ needs.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild-archive.log | grep -E "error:|warning:|ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" build/xcodebuild-archive.log

      - name: Package Payload/PlayDrop.app as an .ipa
        run: |
          ver="${{ needs.version.outputs.version }}"
          app="build/PlayDrop.xcarchive/Products/Applications/PlayDrop.app"
          test -d "$app"
          rm -rf build/ipa && mkdir -p build/ipa/Payload out
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && zip -qry "../../out/playdrop-${ver}-ios-unsigned.ipa" Payload)
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: apps/ios/out/*.ipa
          if-no-files-found: error

      - name: Upload the archive log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-archive-log
          path: apps/ios/build/xcodebuild-archive.log
          if-no-files-found: ignore

  release:
    name: Publish the GitHub release
    needs: [version, linux-deb, flatpak, android, windows, ios]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download every asset
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          ls -la
          test "$(ls | wc -l)" -eq 5
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: PlayDrop ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
