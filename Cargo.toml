[workspace]
resolver = "2"
# apps/cosmic-applet is its own workspace with its own lock file: libcosmic comes from git
# and pulls a large tree that must stay out of this Cargo.lock, the Flatpak crate list and
# the Windows build.
exclude = ["fuzz", "apps/cosmic-applet"]
members = [
    "crates/playdrop-core",
    "crates/playdrop-cli",
    "crates/playdrop-ipc",
    "crates/playdropd",
    "crates/playdrop-platform",
    "apps/desktop",
    "crates/playdrop-ffi",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/QasimBhb/PlayDrop"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# cargo-fuzz builds with --cfg fuzzing; fuzz/ uses it to reach parser entry points (SR-33).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
