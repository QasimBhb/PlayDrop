[workspace]
resolver = "2"
members = [
    "crates/playdrop-core",
    "crates/playdrop-cli",
    "crates/playdrop-ipc",
    "crates/playdropd",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/QasimBhb/PlayDrop"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
