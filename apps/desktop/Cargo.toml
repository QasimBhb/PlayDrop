[package]
name = "playdrop-desktop"
description = "PlayDrop desktop window (Slint): a thin client of playdropd over the local IPC"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "playdrop-desktop"
path = "src/main.rs"

# Same lint set as the workspace, except `unsafe_code` is `deny` rather than `forbid`:
# `WDA_EXCLUDEFROMCAPTURE` on the QR window (SR-9) is one audited `unsafe` call on Windows
# under a scoped `#[allow(unsafe_code)]` with a SAFETY comment. Linux builds contain none.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
playdrop-core = { path = "../../crates/playdrop-core" }
playdrop-ipc = { path = "../../crates/playdrop-ipc" }
qrcode = { version = "0.14.1", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "unstable-winit-030"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.18.1"
