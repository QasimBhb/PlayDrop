[package]
name = "playdrop-platform"
description = "PlayDrop desktop platform hooks shared by the daemon and the CLI host: Windows free space, DPAPI sealing, the owner-only data dir and the exclusive port"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Same lint set as the workspace, except `unsafe_code` is `deny` rather than `forbid`:
# the Windows hooks call Win32 APIs under scoped `#[allow(unsafe_code)]` with SAFETY
# comments. Non-Windows builds contain no unsafe code.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dependencies]
playdrop-core = { path = "../playdrop-core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
