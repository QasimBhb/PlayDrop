[package]
name = "playdrop-ffi"
description = "UniFFI surface over playdrop-core for the Android and iOS hosts"
# Own version: bumped on every change to the frozen surface (docs/core-api.md). 0.2.0 is
# the Phase 5 surface: remote input, peer capabilities, PeerRefused.
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "playdrop_ffi"

# Same lint set as the workspace, except `unsafe_code` is `deny` rather than `forbid`: file
# descriptors handed over by the Android host must be adopted with `FromRawFd`, which is
# `unsafe` by signature. Every such block carries a SAFETY comment and sits under a scoped
# `#[allow(unsafe_code)]`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dependencies]
playdrop-core = { path = "../playdrop-core" }
uniffi = { version = "0.32.2", features = ["tokio"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
thiserror = "2.0.21"
serde_json = "1.0.151"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
log = "0.4.34"
tracing-log = "0.2.0"
jni = "0.22.4"

[dev-dependencies]
tempfile = "3.27.0"
